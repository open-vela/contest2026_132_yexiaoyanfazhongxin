<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 背景圆 -->
  <circle cx="50" cy="50" r="48" fill="#1a1a2e" stroke="#4ade80" stroke-width="2"/>
  
  <!-- 身体轮廓 -->
  <path d="M50 20 C50 20 35 35 35 50 C35 65 42 75 50 80 C58 75 65 65 65 50 C65 35 50 20 50 20" 
        fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 头部 -->
  <circle cx="50" r="10" cy="20" fill="#4ade80"/>
  
  <!-- 脊柱 -->
  <line x1="50" y1="30" x2="50" y2="65" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 肩膀 -->
  <line x1="35" y1="40" x2="65" y2="40" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 手臂 -->
  <path d="M35 40 L25 55 M65 40 L75 55" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 检查标记 -->
  <path d="M70 25 L75 30 L85 20" stroke="#4ade80" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- 文字 "PG" -->
  <text x="50" y="90" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
        fill="#4ade80" text-anchor="middle">PG</text>
</svg>
